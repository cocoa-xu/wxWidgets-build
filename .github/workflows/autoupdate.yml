name: auto-update
run-name: auto-update ${{ inputs.version || 'latest' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'wxWidgets Version (latest when empty)'
        required: false

permissions:
  actions: write
  contents: read

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(gh api repos/wxWidgets/wxWidgets/releases/latest --jq .tag_name)
            VERSION="${VERSION#v}"
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid wxWidgets version: ${VERSION}" >&2
            exit 1
          fi

          echo "Resolved wxWidgets version is ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch precompilation workflows
        if: steps.version.outputs.force == 'true' || steps.check-release.outputs.exists == 'false'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for workflow in linux-glibc.yml linux-musl.yml macos.yml windows.yml; do
            gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" --ref "${REF_NAME}" -f "version=${BUILD_VERSION}"
            echo "Dispatched ${workflow} for v${BUILD_VERSION}"
          done

      - name: Skip existing release
        if: steps.version.outputs.force != 'true' && steps.check-release.outputs.exists == 'true'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} already exists; no jobs dispatched."
